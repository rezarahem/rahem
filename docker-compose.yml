version: '3.8'

services:
  db:
    image: postgres
    container_name: rahem-db
    environment:
      POSTGRES_USER: rahem
      POSTGRES_PASSWORD: rahem
      POSTGRES_DB: rahem
      # TZ: Asia/Tehran
    ports:
      - "7000:5432"
    volumes:
      - my_dbdata:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro  

volumes:
  my_dbdata:
